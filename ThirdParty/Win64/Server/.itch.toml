[[actions]]
name = "Run with bad network conditions"
path = "/GunsmithExamples/Binaries/Win64/GunsmithExamplesServer.exe"
args = ["-server", "-log", "-ini:Engine:[PacketSimulationSettings]:PktLag=200", "-ini:Engine:[PacketSimulationSettings]:PktLoss=1"]
console = true
